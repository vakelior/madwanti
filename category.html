<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
<title>التصنيفات — مدونتي</title>
<meta name="description" content="تصفّح جميع مقالات مدونتي حسب التصنيف." />
<link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/site.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
.page-head{margin:0 0 32px;text-align:center}
.page-head .page-title{font-family:var(--title-font);font-size:38px;color:var(--title-color);margin:0 0 8px;font-weight:700}
.page-head .page-sub{font-size:14px;color:var(--meta-color)}
.cat-filter{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 0 40px}
.cat-filter a{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--title-color);background:var(--gray-bg);border:1px solid var(--border-color);padding:11px 22px;border-radius:30px;transition:all .25s}
.cat-filter a .lc{width:1.1em;height:1.1em}
.cat-filter a:hover,.cat-filter a.active{background:var(--main-color);color:#0a0a0a;border-color:var(--main-color)}
.empty-state{text-align:center;padding:60px 20px;color:var(--meta-color)}
.empty-state .lc{font-size:52px;color:var(--border-color);margin:0 auto 14px;display:block}
.empty-state h3{font-family:var(--title-font);font-size:22px;color:var(--title-color);margin:0 0 6px}
</style>
</head>
<body>

<div id="outer-wrapper">

  <header id="header-wrapper">
    <div class="main-header">
      <div class="container row-x1">
        <div class="header-items">
          <div class="flex-left">
            <button class="mobile-menu-toggle" id="open-menu" aria-label="فتح القائمة"><i data-lucide="menu" class="lc"></i></button>
            <div class="main-logo">
              <span class="logo-mark"><i data-lucide="compass" class="lc"></i></span>
              <span class="title"><a href="index.html">مدونتي<em>.</em></a></span>
            </div>
            <nav>
              <ul class="main-nav">
                <li><a href="index.html"><i data-lucide="home" class="lc"></i>الرئيسية</a></li>
                <li class="has-sub"><a href="#"><i data-lucide="folder-open" class="lc"></i>التصنيفات <i data-lucide="chevron-down" class="lc lc-chev"></i></a>
                  <ul class="sub-menu">
                    <li><a href="category.html?c=تقنية"><i data-lucide="cpu" class="lc"></i>تقنية</a></li>
                    <li><a href="category.html?c=موسيقى"><i data-lucide="music" class="lc"></i>موسيقى</a></li>
                    <li><a href="category.html?c=أخبار"><i data-lucide="newspaper" class="lc"></i>أخبار</a></li>
                    <li><a href="category.html?c=سفر"><i data-lucide="plane" class="lc"></i>سفر</a></li>
                  </ul>
                </li>
                <li><a href="page.html"><i data-lucide="info" class="lc"></i>من نحن</a></li>
                <li><a href="page.html#contact"><i data-lucide="mail" class="lc"></i>اتصل بنا</a></li>
              </ul>
            </nav>
          </div>
          <div class="flex-right">
            <button class="icon-btn darkmode-toggle" aria-label="تبديل الوضع الليلي"><i data-lucide="moon" class="lc"></i></button>
            <button class="icon-btn" id="search-toggle" aria-label="بحث"><i data-lucide="search" class="lc"></i></button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div id="content-wrapper">
    <div class="container row-x1">
      <div class="page-head">
        <h1 class="page-title" id="cat-heading">جميع المقالات</h1>
        <p class="page-sub">تصفّح مجموعتنا المنسّقة من المقالات والقصص.</p>
      </div>
      <div class="cat-filter" id="cat-filter"></div>
      <div class="post-list" id="grid"></div>
    </div>
  </div>

  <footer id="footer-wrapper" data-include-footer></footer>

</div>

<div class="search-overlay" id="search-overlay">
  <div class="search-box">
    <div class="search-head">
      <i data-lucide="search" class="lc"></i>
      <input type="text" id="search-input" placeholder="ابحث عن مقال أو موضوع..." />
      <button class="close-search" aria-label="إغلاق"><i data-lucide="x" class="lc"></i></button>
    </div>
    <div class="search-results"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div id="slide-menu">
  <div class="slide-menu-header">
    <div class="mobile-logo"><span class="logo-mark"><i data-lucide="compass" class="lc"></i></span> مدونتي</div>
    <button class="hide-mobile-menu" id="close-menu" aria-label="إغلاق"><i data-lucide="x" class="lc"></i></button>
  </div>
  <nav class="mobile-menu">
    <a href="index.html"><i data-lucide="home" class="lc"></i>الرئيسية</a>
    <a href="category.html"><i data-lucide="folder-open" class="lc"></i>التصنيفات</a>
    <a href="page.html"><i data-lucide="info" class="lc"></i>من نحن</a>
    <a href="page.html#contact"><i data-lucide="mail" class="lc"></i>اتصل بنا</a>
  </nav>
  <div class="mobile-social">
    <a href="#"><i data-lucide="facebook" class="lc"></i></a>
    <a href="#"><i data-lucide="instagram" class="lc"></i></a>
    <a href="#"><i data-lucide="youtube" class="lc"></i></a>
  </div>
</div>

<button id="back-top" aria-label="العودة للأعلى"><i data-lucide="arrow-up" class="lc"></i></button>

<script src="assets/site.js"></script>
<script>
var cat = q.get('c') || '';

document.getElementById('cat-filter').innerHTML = '<a href="category.html" class="'+(cat?'':'active')+'">'+makeIcon('layout-grid')+'الكل</a>';
document.getElementById('cat-filter').innerHTML += CATEGORIES.map(function(c){
  return '<a href="category.html?c='+encodeURIComponent(c)+'" class="'+(cat===c?'active':'')+'">'+makeIcon(CAT_ICONS[c])+c+'</a>';
}).join('');

var list = cat ? POSTS.filter(function(p){ return p.tag === cat; }) : POSTS;
document.getElementById('cat-heading').textContent = cat || 'جميع المقالات';
if(cat) document.title = cat + ' — مدونتي';

var grid = document.getElementById('grid');
if(!list.length){
  grid.innerHTML = '<div class="empty-state">'+makeIcon('inbox')+'<h3>لا توجد مقالات</h3><p>لم نعثر على مقالات في هذا التصنيف بعد.</p></div>';
} else {
  grid.innerHTML = list.map(function(p){
    return '<article class="post"><div class="card">'
      + '<a class="entry-thumbnail" href="post.html?id='+p.id+'"><img src="'+p.img+'" alt="'+p.title+'" loading="lazy" /></a>'
      + '<div class="entry-header">'
      +   '<span class="entry-tag">'+makeIcon(CAT_ICONS[p.tag])+p.tag+'</span>'
      +   '<h2 class="entry-title"><a href="post.html?id='+p.id+'">'+p.title+'</a></h2>'
      +   '<p class="entry-excerpt">'+p.excerpt+'</p>'
      +   '<div class="entry-meta">'
      +     '<span class="mi">'+makeIcon('calendar')+p.date+'</span>'
      +     '<span class="mi">'+makeIcon('clock')+p.read+'</span>'
      +   '</div>'
      + '</div></div></article>';
  }).join('');
}
initIcons();
</script>
</body>
</html>
