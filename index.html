<div id="outer-wrapper">

  <header id="header-wrapper">

      <div class="container row-x1">
        <div class="header-items">

          <button class="prev" aria-label="السابق"><i data-lucide="chevron-right" class="lc"></i></button>

  </footer>

</div>

<script src="assets/site.js"></script>
<script>
function renderSlider(){
  var wrap = document.getElementById('featured-items');
  var slides = POSTS.slice(0,3);
  var html = slides.map(function(p, i){
    return '<div class="featured-slide'+(i===0?' active':'')+'">'
      + '<img class="thumb-bg" src="'+p.img+'" alt="'+p.title+'" width="1200" height="800" />'
      + '<div class="mask"></div>'
      + '<div class="entry-info">'
      +   '<h2 class="entry-title"><a href="post.html?id='+p.id+'">'+p.title+'</a></h2>'
      +   '<div class="entry-meta">'
      +     '<span class="mi">'+makeIcon('pen-line')+'<span class="author-name">'+p.author+'</span></span>'
      +     '<span class="mi">'+makeIcon('calendar')+p.date+'</span>'
      +   '</div>'
      + '</div></div>';
  }).join('');
  wrap.innerHTML = html + wrap.querySelector('.slider-nav').outerHTML + '<div class="slider-dots"></div>';
  initIcons();

  var dotsBox = wrap.querySelector('.slider-dots');
  var all = wrap.querySelectorAll('.featured-slide');
  var idx = 0;
  all.forEach(function(_, i){
    var b = document.createElement('button');
    if(i===0) b.className='active';
    b.addEventListener('click', function(){ go(i); reset(); });
    dotsBox.appendChild(b);
  });
  function go(i){
    all[idx].classList.remove('active');
    dotsBox.children[idx].classList.remove('active');
    idx = (i + all.length) % all.length;
    all[idx].classList.add('active');
    dotsBox.children[idx].classList.add('active');
  }
  var timer = setInterval(function(){ go(idx+1); }, 6000);
  function reset(){ clearInterval(timer); timer = setInterval(function(){ go(idx+1); }, 6000); }
  wrap.querySelector('.next').addEventListener('click', function(){ go(idx+1); reset(); });
  wrap.querySelector('.prev').addEventListener('click', function(){ go(idx-1); reset(); });
}

function renderGrid(){
  var el = document.getElementById('grid-items');
  el.innerHTML = POSTS.map(function(p){
    return '<article class="post"><div class="card">'
      + '<a class="entry-thumbnail" href="post.html?id='+p.id+'">'
      +   '<img src="'+p.img+'" alt="'+p.title+'" loading="lazy" width="1200" height="800" />'
      + '</a>'
      + '<div class="entry-header">'
      +   '<h2 class="entry-title"><a href="post.html?id='+p.id+'">'+p.title+'</a></h2>'
      +   '<p class="entry-excerpt">'+p.excerpt+'</p>'
      +   '<div class="entry-meta">'
      +     '<span class="mi">'+makeIcon('pen-line')+'<span class="author-name">'+p.author+'</span></span>'
      +     '<span class="mi">'+makeIcon('calendar')+p.date+'</span>'
      +   '</div>'
      + '</div></div></article>';
  }).join('');
  initIcons();
}

renderSlider();
renderGrid();
</script>
</body>
