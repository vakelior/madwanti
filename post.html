<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
<title>مقال — مدونتي</title>
<meta name="description" content="اقرأ أحدث المقالات والقصص من مدونتي — سفر، تقنية، موسيقى وأخبار." />
<link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/site.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
/* أنماط صفحة المقال */
.post-layout{display:flex;gap:44px;justify-content:space-between}
.post-main{width:calc(100% - var(--sidebar-width) - 44px);min-width:0;order:1}
.post-side{width:var(--sidebar-width);flex-shrink:0;order:2}
.breadcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--meta-color);margin:0 0 22px}
.breadcrumb a{color:var(--meta-color)}
.breadcrumb a:hover{color:var(--main-color)}
.breadcrumb .sep{color:var(--border-color)}
.breadcrumb .cur{color:var(--main-color);font-weight:600}
.post-hero{position:relative;border-radius:var(--radius);overflow:hidden;margin:0 0 32px;box-shadow:var(--shadow-md);border:1px solid var(--border-color)}
.post-hero img{width:100%;height:440px;object-fit:cover}
.item-post .entry-tag{display:inline-flex;align-items:center;gap:7px;margin:0 0 18px;font-size:12px}
.item-post h1.entry-title{font-family:var(--title-font);font-size:42px;font-weight:700;line-height:1.2em;color:var(--title-color);margin:0 0 18px}
.post-meta{display:flex;flex-wrap:wrap;align-items:center;gap:20px;padding:0 0 22px;border-bottom:1px solid var(--border-color);margin:0 0 28px}
.post-meta .mi{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--meta-color)}
.post-meta .lc{color:var(--main-color);width:1.1em;height:1.1em}
.post-meta .author-name{color:var(--title-color);font-weight:600}
.post-meta a.cat-link{color:var(--title-color);font-weight:600}
.post-meta a.cat-link:hover{color:var(--main-color)}
.post-body{font-size:17px;color:var(--text-color);line-height:2em}
.post-body p{margin:0 0 26px}
.post-body h2{font-family:var(--title-font);font-size:27px;color:var(--title-color);margin:40px 0 18px;font-weight:700}
.post-body ul,.post-body ol{margin:0 0 26px;padding-right:4px}
.post-body li{position:relative;padding:7px 30px 7px 0}
.post-body ul li:before{content:'';position:absolute;right:0;top:17px;width:8px;height:8px;border-radius:50%;background:var(--main-color)}
.post-body blockquote{position:relative;background:var(--gray-bg);border-right:3px solid var(--main-color);color:var(--title-color);font-family:var(--title-font);font-size:22px;line-height:1.6em;padding:24px 28px;margin:0 0 28px;border-radius:4px 0 0 4px}
.post-body a{border-bottom:1px solid var(--main-color)}
.post-share{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:36px 0 0;padding:20px;background:var(--gray-bg);border:1px solid var(--border-color);border-radius:var(--radius)}
.post-share .share-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--title-color);margin-left:4px}
.post-share .share-label .lc{color:var(--main-color)}
.post-share a{display:flex;align-items:center;justify-content:center;width:42px;height:42px;background:var(--button-bg);color:var(--button-color);border-radius:50%;transition:all .25s}
.post-share a .lc{width:1.15em;height:1.15em}
.post-share a:hover{background:var(--main-color);color:#0a0a0a;transform:translateY(-3px)}
.author-box{display:flex;gap:20px;align-items:center;padding:26px;background:var(--gray-bg);border:1px solid var(--border-color);border-radius:var(--radius);margin:30px 0 0}
.author-avatar{display:flex;align-items:center;justify-content:center;width:74px;height:74px;border-radius:50%;background:var(--grad-main);color:#fff;font-family:var(--title-font);font-size:28px;font-weight:700;flex-shrink:0}
.author-info .by-line{font-size:11.5px;color:var(--main-color);font-weight:600;margin:0 0 4px;letter-spacing:.3px}
.author-info .a-name{font-family:var(--title-font);font-size:21px;color:var(--title-color);font-weight:700;margin:0 0 4px}
.author-info .a-bio{font-size:14px;color:var(--text-color);line-height:1.7em}
.post-side .widget{background:var(--gray-bg);border:1px solid var(--border-color);border-radius:var(--radius);padding:26px;margin:0 0 26px}
.tag-cloud{display:flex;flex-wrap:wrap;gap:10px}
.tag-cloud a{display:inline-flex;align-items:center;font-size:13px;color:var(--tag-color);background:var(--tag-bg);border:1px solid var(--border-color);padding:8px 15px;border-radius:30px;transition:all .25s}
.tag-cloud a:hover{background:var(--main-color);color:#0a0a0a;border-color:var(--main-color)}
@media(max-width:1100px){.post-layout{flex-direction:column}.post-main{width:100%}.post-side{width:100%}}
@media(max-width:980px){.post-hero img{height:330px}.item-post h1.entry-title{font-size:32px}}
@media(max-width:680px){.post-hero img{height:250px}.item-post h1.entry-title{font-size:26px}.post-body{font-size:16px}.author-box{flex-direction:column;text-align:center}}
</style>
</head>
<body>

<div id="outer-wrapper">

  <header id="header-wrapper">
    <div class="main-header">
      <div class="container row-x1">
        <div class="header-items">
          <div class="flex-left">
            <button class="mobile-menu-toggle" id="open-menu" aria-label="فتح القائمة"><i data-lucide="menu" class="lc"></i></button>
            <div class="main-logo">
              <span class="logo-mark"><i data-lucide="compass" class="lc"></i></span>
              <span class="title"><a href="index.html">مدونتي<em>.</em></a></span>
            </div>
            <nav>
              <ul class="main-nav">
                <li><a href="index.html"><i data-lucide="home" class="lc"></i>الرئيسية</a></li>
                <li class="has-sub"><a href="#"><i data-lucide="folder-open" class="lc"></i>التصنيفات <i data-lucide="chevron-down" class="lc lc-chev"></i></a>
                  <ul class="sub-menu">
                    <li><a href="category.html?c=تقنية"><i data-lucide="cpu" class="lc"></i>تقنية</a></li>
                    <li><a href="category.html?c=موسيقى"><i data-lucide="music" class="lc"></i>موسيقى</a></li>
                    <li><a href="category.html?c=أخبار"><i data-lucide="newspaper" class="lc"></i>أخبار</a></li>
                    <li><a href="category.html?c=سفر"><i data-lucide="plane" class="lc"></i>سفر</a></li>
                  </ul>
                </li>
                <li><a href="page.html"><i data-lucide="info" class="lc"></i>من نحن</a></li>
                <li><a href="page.html#contact"><i data-lucide="mail" class="lc"></i>اتصل بنا</a></li>
              </ul>
            </nav>
          </div>
          <div class="flex-right">
            <button class="icon-btn darkmode-toggle" aria-label="تبديل الوضع الليلي"><i data-lucide="moon" class="lc"></i></button>
            <button class="icon-btn" id="search-toggle" aria-label="بحث"><i data-lucide="search" class="lc"></i></button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div id="content-wrapper">
    <div class="container row-x1">
      <div class="post-layout">

        <aside class="post-side">
          <div class="widget">
            <div class="widget-title"><h3 class="title"><i data-lucide="link" class="lc"></i>مقالات ذات صلة</h3></div>
            <div class="side-items" id="related-items"></div>
          </div>
          <div class="widget">
            <div class="widget-title"><h3 class="title"><i data-lucide="hash" class="lc"></i>وسوم</h3></div>
            <div class="tag-cloud" id="tag-cloud"></div>
          </div>
        </aside>

        <article class="post-main item-post">
          <nav class="breadcrumb">
            <a href="index.html">الرئيسية</a><span class="sep">/</span>
            <a href="category.html" id="bc-cat-link">التصنيف</a><span class="sep">/</span>
            <span class="cur" id="bc-tag">مقال</span>
          </nav>
          <span class="entry-tag" id="post-tag"></span>
          <h1 class="entry-title" id="post-title"></h1>
          <div class="post-meta">
            <span class="mi"><i data-lucide="user" class="lc"></i><span class="author-name" id="post-author"></span></span>
            <span class="mi"><i data-lucide="calendar" class="lc"></i><span id="post-date"></span></span>
            <span class="mi"><i data-lucide="clock" class="lc"></i><span id="post-read"></span></span>
            <span class="mi"><i data-lucide="folder-open" class="lc"></i><a class="cat-link" href="category.html" id="post-cat-link"></a></span>
          </div>
          <div class="post-hero"><img id="post-img" src="" alt="" /></div>
          <div class="post-body" id="post-body"></div>

          <div class="post-share">
            <span class="share-label"><i data-lucide="share-2" class="lc"></i>شارك المقال</span>
            <a href="#" title="فيسبوك"><i data-lucide="facebook" class="lc"></i></a>
            <a href="#" title="تويتر"><i data-lucide="twitter" class="lc"></i></a>
            <a href="#" title="واتساب"><i data-lucide="message-circle" class="lc"></i></a>
            <a href="#" title="تيليجرام"><i data-lucide="send" class="lc"></i></a>
            <a href="#" title="لينكد إن"><i data-lucide="linkedin" class="lc"></i></a>
            <a href="#" title="رابط"><i data-lucide="link" class="lc"></i></a>
          </div>

          <div class="author-box">
            <div class="author-avatar" id="author-avatar"></div>
            <div class="author-info">
              <p class="by-line">عن الكاتب</p>
              <h3 class="a-name" id="author-name"></h3>
              <p class="a-bio" id="author-bio"></p>
            </div>
          </div>
        </article>

      </div>
    </div>
  </div>

  <footer id="footer-wrapper" data-include-footer></footer>

</div>

<div class="search-overlay" id="search-overlay">
  <div class="search-box">
    <div class="search-head">
      <i data-lucide="search" class="lc"></i>
      <input type="text" id="search-input" placeholder="ابحث عن مقال أو موضوع..." />
      <button class="close-search" aria-label="إغلاق"><i data-lucide="x" class="lc"></i></button>
    </div>
    <div class="search-results"></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div id="slide-menu">
  <div class="slide-menu-header">
    <div class="mobile-logo"><span class="logo-mark"><i data-lucide="compass" class="lc"></i></span> مدونتي</div>
    <button class="hide-mobile-menu" id="close-menu" aria-label="إغلاق"><i data-lucide="x" class="lc"></i></button>
  </div>
  <nav class="mobile-menu">
    <a href="index.html"><i data-lucide="home" class="lc"></i>الرئيسية</a>
    <a href="category.html"><i data-lucide="folder-open" class="lc"></i>التصنيفات</a>
    <a href="page.html"><i data-lucide="info" class="lc"></i>من نحن</a>
    <a href="page.html#contact"><i data-lucide="mail" class="lc"></i>اتصل بنا</a>
  </nav>
  <div class="mobile-social">
    <a href="#"><i data-lucide="facebook" class="lc"></i></a>
    <a href="#"><i data-lucide="instagram" class="lc"></i></a>
    <a href="#"><i data-lucide="youtube" class="lc"></i></a>
  </div>
</div>

<button id="back-top" aria-label="العودة للأعلى"><i data-lucide="arrow-up" class="lc"></i></button>

<script src="assets/site.js"></script>
<script>
var id = parseInt(q.get('id')) || 1;
var p = POSTS.find(function(x){ return x.id === id; }) || POSTS[0];

document.title = p.title + ' — مدونتي';
document.getElementById('post-title').textContent = p.title;
document.getElementById('post-tag').innerHTML = makeIcon(CAT_ICONS[p.tag]) + p.tag;
document.getElementById('bc-tag').textContent = p.tag;
var bc = document.getElementById('bc-cat-link');
bc.textContent = p.tag;
bc.setAttribute('href', 'category.html?c='+encodeURIComponent(p.tag));
document.getElementById('post-author').textContent = p.author;
document.getElementById('post-date').textContent = p.date;
document.getElementById('post-read').textContent = p.read;
var cl = document.getElementById('post-cat-link');
cl.textContent = p.tag;
cl.setAttribute('href', 'category.html?c='+encodeURIComponent(p.tag));
var img = document.getElementById('post-img');
img.src = p.img; img.alt = p.title;
document.getElementById('post-body').innerHTML = p.body;

var a = AUTHORS[p.author] || { role:'', bio:'' };
document.getElementById('author-avatar').textContent = p.author.charAt(0);
document.getElementById('author-name').textContent = p.author + (a.role ? ' — ' + a.role : '');
document.getElementById('author-bio').textContent = a.bio;

var related = POSTS.filter(function(x){ return x.id !== p.id && x.tag === p.tag; });
if(related.length < 3){ related = related.concat(POSTS.filter(function(x){ return x.id !== p.id && x.tag !== p.tag; })); }
related = related.slice(0,3);
document.getElementById('related-items').innerHTML = related.map(function(r){
  return '<div class="post">'
    + '<a class="entry-thumbnail" href="post.html?id='+r.id+'"><img src="'+r.img+'" alt="" /></a>'
    + '<div class="entry-header"><h2 class="entry-title"><a href="post.html?id='+r.id+'">'+r.title+'</a></h2></div></div>';
}).join('');
initIcons();

document.getElementById('tag-cloud').innerHTML = CATEGORIES.map(function(t){
  return '<a href="category.html?c='+encodeURIComponent(t)+'">#'+t+'</a>';
}).join('');

initIcons();
</script>
</body>
</html>
