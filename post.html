<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
<title>مقال — مدونتي</title>
<meta name="description" content="اقرأ أحدث المقالات من مدونتي." />
<link rel="canonical" href="https://vakelior.github.io/madwanti/post.html" />
<meta name="robots" content="index,follow" />
<meta name="theme-color" content="#000000" />
<link rel="icon" href="images/favicon.svg" type="image/svg+xml" />

<meta property="og:type" content="article" />
<meta property="og:site_name" content="مدونتي" />
<meta property="og:locale" content="ar" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/site.css" />
<script src="https://unpkg.com/lucide@0.454.0"></script>
</head>
<body>
<a class="skip-link" href="#content-wrapper">تخطَّ إلى المحتوى</a>

<div id="outer-wrapper">

  <header id="header-wrapper">
    <div class="main-header">
      <div class="container row-x1">
        <div class="header-items">
          <div class="main-logo">
            <span class="logo-mark"><i data-lucide="feather" class="lc"></i></span>
            <span class="title"><a href="index.html">مدونتي<em>.</em></a></span>
          </div>
          <div class="flex-right">
            <button class="icon-btn darkmode-toggle" aria-label="تبديل الوضع الليلي" aria-pressed="false"><i data-lucide="moon" class="lc"></i><i data-lucide="sun" class="lc"></i></button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div id="content-wrapper">
    <div class="container row-x1">
      <article class="post-main item-post">
        <h1 class="entry-title" id="post-title"></h1>
        <div class="post-meta">
          <span class="mi"><i data-lucide="pen-line" class="lc"></i><span class="author-name" id="post-author"></span></span>
          <span class="mi"><i data-lucide="calendar" class="lc"></i><span id="post-date"></span></span>
        </div>
        <div class="post-hero"><img id="post-img" src="" alt="" /></div>
        <div class="post-body" id="post-body"></div>
      </article>
    </div>
  </div>

  <footer id="footer-wrapper">
    <div class="footer-bar"><div class="container row-x1">
      <div class="footer-copyright"><i data-lucide="copyright" class="lc"></i>© 2026 <a href="index.html">مدونتي</a> — جميع الحقوق محفوظة</div>
    </div></div>
  </footer>

</div>

<script src="assets/site.js"></script>
<script>
var q = new URLSearchParams(location.search);
var id = parseInt(q.get('id')) || 1;
var p = POSTS.find(function(x){ return x.id === id; }) || POSTS[0];

document.title = p.title + ' — مدونتي';

/* تحسين SEO الديناميكي */
function setMeta(attr, val){
  var m = document.querySelector('meta['+attr+']');
  if(m) m.setAttribute('content', val);
}
setMeta('property="og:title"', p.title);
setMeta('property="og:description"', p.excerpt);
setMeta('property="og:image"', 'https://vakelior.github.io/madwanti/' + p.img);
setMeta('property="og:url"', 'https://vakelior.github.io/madwanti/post.html?id=' + p.id);
setMeta('name="description"', p.excerpt);
setMeta('name="twitter:title"', p.title);
setMeta('name="twitter:description"', p.excerpt);
setMeta('name="twitter:image"', 'https://vakelior.github.io/madwanti/' + p.img);
var canon = document.querySelector('link[rel="canonical"]');
if(canon) canon.href = 'https://vakelior.github.io/madwanti/post.html?id=' + p.id;

/* محتوى JSON-LD Structured Data */
var isoDates = {1:'2026-09-08',2:'2026-09-07',3:'2026-09-06',4:'2026-09-05',5:'2026-09-03',6:'2026-09-01'};
var jsonld = document.createElement('script');
jsonld.type = 'application/ld+json';
jsonld.textContent = JSON.stringify({
  '@context':'https://schema.org',
  '@type':'BlogPosting',
  'headline':p.title,
  'description':p.excerpt,
  'image':'https://vakelior.github.io/madwanti/' + p.img,
  'author':{'@type':'Person','name':p.author},
  'datePublished':(isoDates[p.id] || '2026-09-08') + 'T00:00:00+01:00',
  'publisher':{'@type':'Organization','name':'مدونتي'},
  'mainEntityOfPage':'https://vakelior.github.io/madwanti/post.html?id=' + p.id
});
document.head.appendChild(jsonld);

document.getElementById('post-title').textContent = p.title;
document.getElementById('post-author').textContent = p.author;
document.getElementById('post-date').textContent = p.date;
var img = document.getElementById('post-img');
img.src = p.img; img.alt = p.title;
img.width = 1200; img.height = 800;
document.getElementById('post-body').innerHTML = p.body;
initIcons();
</script>
</body>
</html>
